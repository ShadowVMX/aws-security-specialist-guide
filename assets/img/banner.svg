<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111b2b"/>
      <stop offset="100%" stop-color="#182338"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ffb84d"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="280" rx="26" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="280" rx="26" fill="url(#dots)"/>

  <circle cx="175" cy="140" r="160" fill="url(#glow)" filter="url(#blur1)"/>

  <!-- shield + lock icon -->
  <g transform="translate(95,72)">
    <path d="M65 0 L128 24 V78 C128 122 100 156 65 170 C30 156 2 122 2 78 V24 Z"
          fill="#16202f" stroke="#ff9900" stroke-width="3.5"/>
    <path d="M65 10 L118 30 V78 C118 116 94 145 65 158 C36 145 12 116 12 78 V30 Z"
          fill="none" stroke="#ffb84d" stroke-width="1" opacity="0.35"/>
    <rect x="42" y="76" width="46" height="36" rx="6" fill="#ff9900"/>
    <path d="M50 76 V62 a15 15 0 0 1 30 0 V76" fill="none" stroke="#ff9900" stroke-width="7"/>
    <circle cx="65" cy="94" r="5.5" fill="#16202f"/>
  </g>

  <!-- title block -->
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="300" y="112" font-size="46" font-weight="800" fill="#f2f6fb" letter-spacing="-0.5">AWS Certified Security</text>
    <text x="300" y="160" font-size="46" font-weight="800" fill="#f2f6fb" letter-spacing="-0.5">— Specialty</text>
    <text x="303" y="200" font-size="21" font-weight="700" fill="#ff9900" letter-spacing="0.5">SCS-C03 · INTERACTIVE STUDY GUIDE</text>
    <text x="303" y="230" font-size="15.5" fill="#9fb0c3">6 domains · 127 practice questions · diagrams · ES / EN</text>
  </g>

  <!-- decorative network nodes bottom-right -->
  <g stroke="#3a4d68" stroke-width="1.4" opacity="0.9">
    <line x1="880" y1="230" x2="960" y2="190"/>
    <line x1="960" y1="190" x2="1040" y2="215"/>
    <line x1="960" y1="190" x2="1010" y2="140"/>
    <line x1="1010" y1="140" x2="1090" y2="120"/>
    <line x1="1010" y1="140" x2="1075" y2="175"/>
    <line x1="1090" y1="120" x2="1150" y2="95"/>
  </g>
  <g fill="#ff9900">
    <circle cx="880" cy="230" r="4"/>
    <circle cx="1040" cy="215" r="3.5" fill="#4fa8ff"/>
    <circle cx="1090" cy="120" r="4"/>
    <circle cx="1150" cy="95" r="3.5" fill="#3ecf8e"/>
  </g>
  <g fill="#e6edf5">
    <circle cx="960" cy="190" r="5"/>
    <circle cx="1010" cy="140" r="5"/>
    <circle cx="1075" cy="175" r="3.5" fill="#b892ff"/>
  </g>

  <rect x="0" y="272" width="1200" height="8" rx="4" fill="url(#barGrad)"/>
</svg>
